<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-labelledby="ft">
  <title id="ft">Drawing title block — LonggerKing, Backend Engineer</title>

  <style>
    :root{
      --paper:#FBFAF7;
      --ink:#221E19;
      --ink-3:#8A8378;
      --accent:#C2571A;
      --rule:rgba(34,30,25,0.18);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --paper:#131110;
        --ink:#F1EBE1;
        --ink-3:#7C746A;
        --accent:#E07B3C;
        --rule:rgba(241,235,225,0.18);
      }
    }
    .mono{ font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
    .k{ fill:var(--ink-3); font-size:8px; letter-spacing:2.2px; }
    .v{ fill:var(--ink); font-size:11px; letter-spacing:.6px; }
    .a{ fill:var(--accent); font-size:11px; letter-spacing:.6px; }
    .ln{ stroke:var(--rule); stroke-width:1; fill:none; }
  </style>

  <rect width="1200" height="96" fill="var(--paper)"/>

  <g class="ln">
    <path d="M64 20H1136M64 78H1136"/>
    <path d="M64 20v58M290 20v58M520 20v58M740 20v58M880 20v58M1010 20v58M1136 20v58"/>
  </g>

  <g class="mono">
    <text class="k" x="76" y="38">DRAWN BY</text>
    <text class="v" x="76" y="58">LonggerKing</text>

    <text class="k" x="302" y="38">DISCIPLINE</text>
    <text class="v" x="302" y="58">Distributed Systems</text>

    <text class="k" x="532" y="38">LOCATION</text>
    <text class="v" x="532" y="58">Guilin, CN · UTC+8</text>

    <text class="k" x="752" y="38">SCALE</text>
    <text class="v" x="752" y="58">1 : 1</text>

    <text class="k" x="892" y="38">SHEET</text>
    <text class="v" x="892" y="58">01 / 01</text>

    <text class="k" x="1022" y="38">REVISION</text>
    <text class="a" x="1022" y="58">REV.04</text>
  </g>
</svg>
