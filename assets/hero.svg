<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">LonggerKing — Backend Engineer</title>
  <desc id="d">工程图纸风格的个人主页横幅：标题与职位说明，右侧是一条从边缘节点经网关到数据层的请求路径示意图，含重试回路。</desc>

  <style>
    :root{
      --paper:#FBFAF7;
      --ink:#221E19;
      --ink-2:#5A5349;
      --ink-3:#8A8378;
      --accent:#C2571A;
      --grid:rgba(34,30,25,0.05);
      --grid-strong:rgba(34,30,25,0.085);
      --rule:rgba(34,30,25,0.16);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --paper:#131110;
        --ink:#F1EBE1;
        --ink-2:#B4ABA0;
        --ink-3:#7C746A;
        --accent:#E07B3C;
        --grid:rgba(241,235,225,0.045);
        --grid-strong:rgba(241,235,225,0.08);
        --rule:rgba(241,235,225,0.16);
      }
    }

    .mono{ font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
    .serif{ font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif; }
    .sans{ font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif; }

    .label{ fill:var(--ink-3); font-size:11.5px; letter-spacing:3px; }
    .anno{ fill:var(--ink-3); font-size:10.5px; letter-spacing:1.6px; }
    .anno-a{ fill:var(--accent); font-size:10.5px; letter-spacing:1.6px; }

    .wire{ fill:none; stroke:var(--ink-3); stroke-width:1.2; opacity:.55; }
    .wire-a{ fill:none; stroke:var(--accent); stroke-width:1.4; }
    .wire-dash{ fill:none; stroke:var(--accent); stroke-width:1.1; stroke-dasharray:4 4; opacity:.75; }
    .node{ fill:var(--paper); stroke:var(--rule); stroke-width:1.4; }
    .node-a{ fill:var(--paper); stroke:var(--accent); stroke-width:1.6; }

    .draw{ stroke-dasharray:460; stroke-dashoffset:460; animation:draw 2.4s cubic-bezier(.16,1,.3,1) forwards; }
    .d1{ animation-delay:.15s; }
    .d2{ animation-delay:.6s; }
    .d3{ animation-delay:1.05s; }
    @keyframes draw{ to{ stroke-dashoffset:0; } }

    .pop{ opacity:0; animation:pop .55s cubic-bezier(.16,1,.3,1) forwards; }
    .p1{ animation-delay:.55s; } .p2{ animation-delay:.85s; }
    .p3{ animation-delay:1.15s; } .p4{ animation-delay:1.45s; } .p5{ animation-delay:1.7s; }
    @keyframes pop{ from{ opacity:0; } to{ opacity:1; } }

    .rise{ opacity:0; transform:translateY(10px); animation:rise .9s cubic-bezier(.16,1,.3,1) forwards; }
    .r1{ animation-delay:.1s; } .r2{ animation-delay:.22s; } .r3{ animation-delay:.34s; } .r4{ animation-delay:.46s; }
    @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

    .beat{ animation:beat 2.6s ease-in-out infinite; }
    @keyframes beat{ 0%,100%{ opacity:.2; } 50%{ opacity:.85; } }

    @media (prefers-reduced-motion: reduce){
      .draw{ stroke-dashoffset:0; animation:none; }
      .pop,.rise{ opacity:1; animation:none; transform:none; }
      .beat{ animation:none; opacity:.4; }
      .packet{ display:none; }
    }
  </style>

  <defs>
    <pattern id="gs" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="var(--grid)" stroke-width="1"/>
    </pattern>
    <pattern id="gl" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#gs)"/>
      <path d="M60 0H0V60" fill="none" stroke="var(--grid-strong)" stroke-width="1"/>
    </pattern>
    <path id="route" d="M 793 150 H 862 L 980 112 H 1092 V 143"/>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- 纸面 -->
  <rect width="1200" height="320" fill="var(--paper)"/>
  <rect width="1200" height="320" fill="url(#gl)"/>
  <!-- 裁切标记 -->
  <g stroke="var(--rule)" stroke-width="1" fill="none">
    <path d="M16 34V16h18M1166 16h18v18M1184 286v18h-18M34 304H16v-18"/>
  </g>

  <!-- 顶部标注 -->
  <g class="rise r1">
    <rect x="64" y="50" width="26" height="1.5" fill="var(--accent)"/>
    <text class="mono label" x="100" y="56">README.MD — PROFILE — REV.04</text>
  </g>

  <!-- 标题区 -->
  <g class="rise r2">
    <text class="serif" x="62" y="148" font-size="78" letter-spacing="-2.5" fill="var(--ink)">LonggerKing</text>
  </g>
  <g class="rise r3">
    <text class="sans" x="65" y="190" font-size="21" letter-spacing="0.5" fill="var(--ink-2)">后端工程师 · 写撑得住的系统</text>
  </g>
  <g class="rise r4">
    <text class="mono" x="65" y="226" font-size="11" letter-spacing="2.4" fill="var(--accent)">DESIGNING SYSTEMS THAT HOLD UP UNDER LOAD</text>
  </g>

  <!-- ============ 请求路径示意图 ============ -->
  <g>
    <!-- 主干：EDGE → GW → SVC-A → DATA -->
    <use href="#route" class="wire-a draw d1"/>
    <!-- 分支：GW → SVC-B → DATA -->
    <path d="M 862 150 L 980 188 H 1092 V 157" class="wire draw d2"/>
    <!-- 重试回路：DATA 上行回到 GW -->
    <path d="M 1099 150 H 1114 V 84 H 862 V 136" class="wire-dash draw d3" marker-end="url(#ar)"/>
    <text class="mono anno-a" x="977" y="76" text-anchor="middle">RETRY ×2</text>

    <!-- 节点 -->
    <rect class="node pop p1" x="786" y="143" width="14" height="14"/>
    <rect class="node pop p2" x="855" y="143" width="14" height="14"/>
    <rect class="node pop p3" x="973" y="105" width="14" height="14"/>
    <rect class="node pop p4" x="973" y="181" width="14" height="14"/>
    <rect class="node-a pop p5" x="1085" y="143" width="14" height="14"/>

    <!-- 数据节点脉冲 -->
    <circle class="beat" cx="1092" cy="150" r="13" fill="none" stroke="var(--accent)" stroke-width="1"/>
    <circle cx="1092" cy="150" r="3" fill="var(--accent)"/>

    <!-- 沿主干流动的数据包 -->
    <circle class="packet" r="2.8" fill="var(--accent)">
      <animateMotion dur="3.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#route"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <!-- 节点标注 -->
    <g class="mono anno">
      <text x="793" y="176" text-anchor="middle">EDGE</text>
      <text x="862" y="176" text-anchor="middle">GW</text>
      <text x="980" y="98" text-anchor="middle">SVC-A</text>
      <text x="980" y="212" text-anchor="middle">SVC-B</text>
      <text x="1092" y="176" text-anchor="middle">DATA</text>
    </g>

    <!-- 尺寸线 -->
    <g stroke="var(--rule)" stroke-width="1" fill="none" class="pop p1">
      <path d="M793 244H1085M793 239v10M1085 239v10"/>
    </g>
    <text class="mono anno" x="939" y="262" text-anchor="middle" opacity=".8">292 PX · 1 HOP</text>
  </g>

  <!-- 底部图注 -->
  <g>
    <path d="M64 282H1136" stroke="var(--rule)" stroke-width="1" fill="none"/>
    <text class="mono anno" x="64" y="304">FIG.01 — REQUEST PATH</text>
    <text class="mono anno-a" x="1136" y="304" text-anchor="end">5 NODES / 3 HOPS</text>
  </g>
</svg>
